
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Generator</title>
</head>
<body>

    <h2>OTP Generator</h2>

    <h3 id="otp">Waiting for OTP...</h3>
    <button id="otpButton" onclick="startOTP()">Generate OTPs</button>

    <script>
        let count = 0;
        let interval;

        function generateOTP() {
            const otp = Math.floor(1000 + Math.random() * 9000);

            document.getElementById("otp").innerText = "OTP: " + otp;
            count++;

            if (count === 4) {
                clearInterval(interval);

                const button = document.getElementById("otpButton");
                button.disabled = true;
                button.innerText = "Completed";
            }
        }

        function startOTP() {
            const button = document.getElementById("otpButton");
            button.disabled = true;
            count = 0;

            generateOTP();

            if (count < 4) {
                interval = setInterval(() => {
                    generateOTP();
                }, 3000);
            }
        }
    </script>

</body>
</html>
