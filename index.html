
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Generator</title>
</head>
<body>

    <h1>OTP Generator</h1>

    <button id="generateBtn" onclick="OtpHandling()">
        Generate OTP
    </button>

    <div id="otpOutput"></div>

    <script>
        let count = 0;
        let interval;

        function generateOTP() {
            const otp = Math.floor(1000 + Math.random() * 9000);

            count++;

            console.log("OTP " + count + ":", otp);

            const otpElement = document.createElement("p");
            otpElement.textContent = "OTP " + count + ": " + otp;

            document.getElementById("otpOutput").appendChild(otpElement);

            if (count === 5) {
                clearInterval(interval);

                const button = document.getElementById("generateBtn");
                button.disabled = true;
                button.textContent = "You have reached your limit";

                console.log("You have reached your limit!");
            }
        }

        function OtpHandling() {
            const button = document.getElementById("generateBtn");

            if (count > 0) return;

            button.disabled = true;

            generateOTP(); // First OTP immediately

            interval = setInterval(() => {
                generateOTP(); // Next OTP every 3 seconds
            }, 3000);
        }
    </script>

</body>
</html>
