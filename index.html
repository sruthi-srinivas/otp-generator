
<!DOCTYPE html>
<html>
<head>
    <title>OTP Generator</title>
</head>
<body>

    <h2>OTP Generator</h2>

    <button id="otpButton" onclick="startOTP()">Generate OTPs</button>

    <script>
        let count = 0;
        let interval;

        function generateOTP() {
            const otp = Math.floor(1000 + Math.random() * 9000);
            console.log("OTP:", otp);
            count++;

            if (count === 4) {
                clearInterval(interval);
                document.getElementById("otpButton").disabled = true;
                document.getElementById("otpButton").innerText = "You have reached youre limit";
            }
        }

        function startOTP() {
            const button = document.getElementById("otpButton");

            button.disabled = true;
            count = 0;

            generateOTP(); // First OTP immediately

            if (count < 4) {
                interval = setInterval(() => {
                    generateOTP();
                }, 3000);
            }
        }
    </script>

</body>
</html>
