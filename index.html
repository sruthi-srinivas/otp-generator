
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Generator</title>
</head>
<body>

    <h2>OTP Generator</h2>

    <div id="otpList"></div>

    <button id="otpButton" onclick="startOTP()">Generate OTPs</button>

    <script>
        let count = 0;
        let interval;

        function generateOTP() {
            const otp = Math.floor(1000 + Math.random() * 9000);

            count++;

            // Display OTP on webpage
            const otpElement = document.createElement("p");
            otpElement.innerText = "OTP " + count + ": " + otp;
            document.getElementById("otpList").appendChild(otpElement);

            // Print OTP in browser console
            console.log("OTP " + count + ": " + otp);

            if (count === 4) {
                clearInterval(interval);

                const button = document.getElementById("otpButton");
                button.disabled = true;
                button.innerText = "You have reached your limit";
            }
        }

        function startOTP() {
            const button = document.getElementById("otpButton");
            button.disabled = true;

            count = 0;
            document.getElementById("otpList").innerHTML = "";

            generateOTP(); // First OTP immediately

            if (count < 4) {
                interval = setInterval(() => {
                    generateOTP();
                }, 3000);
            }
        }
    </script>

</body>
</html>
